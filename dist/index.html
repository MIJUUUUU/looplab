<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Looplab — 코드와 미리보기</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script></head><body>
<header><div class="headerleft"><a class="brand" href="./">Looplab</a><details class="menu" id="frameworkMenu"><summary><span id="frameworkName">React</span> <span class="chevron">⌄</span></summary><div class="popover" id="frameworks"><button data-mode="react">React <small>TypeScript</small></button><button data-mode="vue">Vue <small>TypeScript</small></button><button data-mode="html">HTML <small>CSS · JavaScript</small></button></div></details></div><details class="menu settings"><summary aria-label="설정">설정 <span class="chevron">⌄</span></summary><div class="popover"><label><input id="tailwind" type="checkbox" checked> Tailwind CSS</label><label><input id="autorun" type="checkbox" checked> 자동 실행</label><hr><button id="download">코드 내보내기</button><button id="reset">예제 복원</button><span id="saveStatus">로컬 자동 저장</span></div></details></header>
<main><div class="intro"><h1>무엇을 만들어 볼까요?</h1><p>코드를 붙여넣으면, 옆에서 바로 실행돼요.</p></div>
<div class="workspace"><section class="editorpane" aria-label="코드"><div class="panelbar"><strong>코드</strong><div id="filetabs"></div><span id="language" hidden>TSX</span></div><div class="codearea"><pre id="lines" aria-hidden="true"></pre><textarea id="editor" aria-label="코드 편집기" spellcheck="false" autocapitalize="off"></textarea></div><div class="composerbar"><span id="editStatus" role="status" aria-live="polite">수정하면 자동으로 반영돼요</span><button class="primary run" id="run" title="실행 (⌘ / Ctrl + Enter)">실행 <span>↑</span></button></div><footer hidden><span id="cursor"></span><span id="modeLabel"></span></footer></section>
<section class="previewpane" aria-label="미리보기"><div class="panelbar"><strong>미리보기</strong><div class="previewActions"><button id="desktop" class="active" aria-label="데스크톱 미리보기" title="데스크톱">▱</button><button id="mobile" aria-label="모바일 미리보기" title="모바일">▯</button><button id="refresh" aria-label="미리보기 새로고침" title="새로고침">↻</button></div></div><div id="previewError" role="alert" hidden></div><div id="previewStage"><iframe title="웹 실행 미리보기" id="preview" sandbox="allow-scripts"></iframe></div><div class="previewfooter"><span id="previewMode" hidden>react</span><span id="buildStatus" role="status">준비 중</span></div></section></div>
<details class="devtools" id="toolsDrawer"><summary>API 테스트 · 콘솔 <span class="chevron">⌄</span></summary><div class="tooltabs"><button class="active" data-tool="api">API 테스트</button><button data-tool="console">콘솔 <span id="logCount">0</span></button><button class="clear" id="clear">지우기</button></div><div id="consolePanel" hidden><div id="logs"><div class="empty">실행 로그와 오류가 여기에 표시됩니다.</div></div></div><div id="apiPanel"><div class="request"><select id="method" aria-label="HTTP 메서드"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option></select><input id="url" aria-label="API URL" value="https://jsonplaceholder.typicode.com/todos/1"><button class="primary" id="send">요청 보내기 ↗</button><button id="cancel" disabled>취소</button></div><div class="apiGrid"><div><label for="headers">HEADERS · JSON</label><textarea id="headers" spellcheck="false">{ "Content-Type": "application/json" }</textarea><label for="body">BODY · GET / HEAD에서는 제외</label><textarea id="body" spellcheck="false">{ "title": "Hello, Looplab", "completed": false }</textarea><small>브라우저 직접 요청 · CORS 허용 필요 · 비밀 키는 입력하지 마세요.</small></div><div><div class="responsebar"><label>RESPONSE</label><span id="apiStatus">요청 대기 중</span></div><pre id="response">응답 본문과 상태를 여기서 확인하세요.</pre></div></div></div></details><p class="bottomnote">React, Vue, HTML 그리고 Tailwind. 필요한 도구만, 간단하게.</p></main><script type="module" src="app.js"></script></body></html>
